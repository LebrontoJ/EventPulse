services:
  kafka:
    image: apache/kafka:3.7.1
    container_name: eventpulse-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "eventpulse-kraft-cluster-1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot job that creates the 'requests' topic once the broker is healthy, then exits.
  kafka-init:
    image: apache/kafka:3.7.1
    container_name: eventpulse-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
      --create --if-not-exists --topic requests --partitions 1 --replication-factor 1

  # Optional web UI for browsing topics/messages. Start with: docker compose --profile ui up -d
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: eventpulse-kafka-ui
    profiles: ["ui"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: eventpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # Optional Prometheus server, scraping the EventPulse apps running on the host (they are not
  # containerized). Start with: docker compose --profile metrics up -d
  # Requires the apps to be started with metrics.enabled=true (the default).
  prometheus:
    image: prom/prometheus:latest
    container_name: eventpulse-prometheus
    profiles: ["metrics"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Lets the container reach the host's metrics ports (9404/9405) as host.docker.internal.
      # Resolves automatically on Docker Desktop; host-gateway makes it work on Linux too.
      - "host.docker.internal:host-gateway"
