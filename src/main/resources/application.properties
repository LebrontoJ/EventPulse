# Default runtime configuration for EventPulse.
#
# Values here are the built-in defaults. They can be overridden by:
#   1. an external config file, pointed to via -Dconfig.file=/path/to/file.properties
#      or the EVENTPULSE_CONFIG_FILE environment variable
#   2. individual -D system properties, which always take highest precedence
#
# validation.rules.path is intentionally left blank: when blank, EventPulseApplication
# falls back to the bundled validation-rules.yml resource on the classpath.

kafka.bootstrap.servers=localhost:9092
kafka.topic=requests
kafka.group.id=eventpulse-v1
kafka.poll.timeout.ms=1000
kafka.producer.client.id=eventpulse-generator

validation.rules.path=

threadpool.core.size=4
threadpool.max.size=8
threadpool.queue.capacity=1000

generator.interval.ms=1000
generator.invalid.rate.percent=5
generator.max.requests=0
