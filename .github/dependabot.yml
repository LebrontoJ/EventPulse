version: 2
updates:
  # Maven dependencies (kafka-clients, jackson-databind, logback, etc.) - these are the ones with
  # an actual history of security advisories, so keeping them current matters most.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Versions pinned in .github/workflows/*.yml (actions/checkout, actions/setup-java, etc.).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
