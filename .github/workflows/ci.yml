name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # `verify` runs the unit tests (Surefire), the Testcontainers-based integration tests in
      # src/test/java/com/eventpulse/integration (Failsafe - these spin up a real Kafka broker in
      # Docker, which ubuntu-latest GitHub-hosted runners provide out of the box), and then the
      # JaCoCo coverage-threshold check, all bound to the verify phase (see pom.xml), so a failure
      # or coverage regression in either test suite fails the build. It also passes through the
      # package phase, which builds the shaded jar used by the Dockerfile.
      - name: Build, test, and enforce coverage
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  # Non-blocking (exit-code: 0) for now: this is the first pass at dependency/image scanning, and
  # failing the build on day one for a backlog of pre-existing findings nobody has triaged yet would
  # just get the check ignored. Results still show up in the GitHub Security tab either way. Once
  # the current findings have been reviewed, flip exit-code to 1 (or add a severity/ignore policy)
  # to actually gate merges on it.
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies for known vulnerabilities (pom.xml)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-dependencies.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
      - name: Upload dependency scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dependencies.sarif
          category: trivy-dependencies

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build application Docker image
        run: docker build -t eventpulse:ci .
      - name: Scan Docker image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eventpulse:ci
          scan-type: image
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
