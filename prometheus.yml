# Scrape config for the optional Prometheus service in docker-compose.yml.
# The EventPulse apps run on the host (not containerized), so targets use
# host.docker.internal to reach them from inside the Prometheus container.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "eventpulse-consumer"
    static_configs:
      - targets: ["host.docker.internal:9404"]

  - job_name: "eventpulse-generator"
    static_configs:
      - targets: ["host.docker.internal:9405"]
